# The same Iceberg REST catalog and S3 warehouse the Spark jobs and dbt use,
# so every table is queryable over plain SQL (Grafana, any JDBC client).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=marketlake
s3.aws-secret-key=marketlake
