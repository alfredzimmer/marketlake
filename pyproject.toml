[project]
name = "marketlake"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.16.1",
    "dagster>=1.12",
    "dagster-dbt>=0.28",
    "dbt-core>=1.10,<1.13",
    "dbt-spark[session]>=1.11",
    "httpx>=0.28.1",
    "pyarrow>=26.0.1",
    "pyspark==4.0.1",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "dagster-webserver>=1.12",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketlake"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.dagster]
module_name = "marketlake.orchestration.definitions"
