services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports:
      - "19092:19092"
      - "18081:18081"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      retries: 20

  console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # S3-compatible object store for the Iceberg warehouse. (MinIO's public
  # images were withdrawn; SeaweedFS speaks the same S3 API.)
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -ip=seaweedfs -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    ports:
      - "8333:8333"
    volumes:
      - seaweed-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9333/cluster/status || exit 1"]
      interval: 5s
      retries: 30

  init-bucket:
    image: chrislusf/seaweedfs:4.48
    entrypoint: >
      sh -c "sleep 3; echo 's3.bucket.create -name warehouse' | weed shell -master=seaweedfs:9333 || true"
    depends_on:
      seaweedfs:
        condition: service_healthy

  catalog-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
      POSTGRES_DB: iceberg_catalog
    volumes:
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg -d iceberg_catalog"]
      interval: 3s
      retries: 20

  iceberg-rest:
    build: infra/iceberg-rest
    environment:
      CATALOG_URI: jdbc:postgresql://catalog-db:5432/iceberg_catalog
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: iceberg
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://seaweedfs:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: marketlake
      AWS_SECRET_ACCESS_KEY: marketlake
      AWS_REGION: us-east-1
    ports:
      - "8181:8181"
    depends_on:
      catalog-db:
        condition: service_healthy
      init-bucket:
        condition: service_completed_successfully

  # SQL over the lake: reads the same Iceberg catalog as Spark and dbt.
  trino:
    image: trinodb/trino:484
    ports:
      - "8090:8080"
    volumes:
      - ./infra/trino/catalog/lake.properties:/etc/trino/catalog/lake.properties:ro
    mem_limit: 2g
    depends_on:
      iceberg-rest:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "trino --execute 'SELECT 1' || exit 1"]
      interval: 5s
      retries: 30

  # Demo dashboards over Trino, provisioned from infra/grafana.
  grafana:
    image: grafana/grafana:13.1.10
    ports:
      - "3001:3000"
    environment:
      # Install before the server starts, so dashboards never load without it.
      GF_PLUGINS_PREINSTALL_SYNC: trino-datasource@1.4.1
      GF_SECURITY_ADMIN_PASSWORD: marketlake
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/market.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      trino:
        condition: service_healthy

  # Run Spark jobs inside the network instead of through the host port proxy
  # (#18). Not started by `up`; use e.g.
  #   docker compose run --rm spark python -m marketlake.spark.bench_files scan
  spark:
    build:
      context: .
      dockerfile: infra/spark/Dockerfile
    profiles: [spark]
    environment:
      ICEBERG_REST_URI: http://iceberg-rest:8181
      S3_ENDPOINT: http://seaweedfs:8333
    volumes:
      - ./src:/app/src:ro
      - ./dbt:/app/dbt
      - spark-ivy:/root/.ivy2.5.2
    depends_on:
      iceberg-rest:
        condition: service_started

  init-topics:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    entrypoint: >
      bash -c "rpk topic create trades.raw -p 6 -X brokers=redpanda:9092 || true;
               rpk topic create ingest.gaps -p 1 -X brokers=redpanda:9092 || true"
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  seaweed-data:
  catalog-data:
  spark-ivy:
